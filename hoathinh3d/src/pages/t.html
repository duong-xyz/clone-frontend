<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <main id="main-contents" class="col-xs-12 col-sm-12 col-md-12 hh3d-follow-page-wrap"
        style="--hh3d-follow-frosted:url('https://hoathinh3d.st/wp-content/themes/halimmovies-child/assets/image/frosted.png');">
        <div class="hh3d-follow-page">
            <div class="hh3d-follow-toolbar">
                <div class="hh3d-follow-toolbar__inner">
                    <header class="hh3d-follow-header">
                        <div>
                            <h1 class="hh3d-follow-header__title"><i class="fas fa-heart" aria-hidden="true"></i> Tủ
                                phim theo dõi</h1>
                            <p id="totalFollowsText" class="hh3d-follow-header__count">Bạn đang theo dõi 2 bộ phim</p>
                        </div>
                    </header>
                    <div class="hh3d-follow-sort"> <button type="button" class="hh3d-follow-sort__btn is-active"
                            data-sort="modified"> <i class="far fa-clock" aria-hidden="true"></i> <span
                                class="hh3d-follow-sort__label">Cập nhật mới</span> </button> <button type="button"
                            class="hh3d-follow-sort__btn" data-sort="date_added"> <i class="far fa-bookmark"
                                aria-hidden="true"></i> <span class="hh3d-follow-sort__label">Đã lưu gần đây</span>
                        </button> <button type="button" class="hh3d-follow-sort__btn" data-sort="title"> <i
                                class="fas fa-sort-alpha-down" aria-hidden="true"></i> <span
                                class="hh3d-follow-sort__label">A-Z</span> </button></div>
                    <div class="hh3d-follow-search"> <i class="fas fa-search hh3d-follow-search__icon"
                            aria-hidden="true"></i> <input type="search" id="followSearch"
                            class="hh3d-follow-search__input" placeholder="Tìm kiếm phim..." autocomplete="off"></div>
                </div>
            </div>
            <div id="followsGrid" class="hh3d-follow-grid" aria-live="polite">
                <article class="hh3d-follow-card" data-id="20224">
                    <div class="hh3d-follow-card__poster">
                        <a href="https://hoathinh3d.st/tien-nghich" class="hh3d-follow-card__thumb" title="Tiên Nghịch">
                            <img src="https://hoathinh3d.st/wp-content/uploads/2023/09/tien-nghich-6-300x450.jpg"
                                alt="Tiên Nghịch" loading="lazy">
                        </a>
                        <span class="hh3d-follow-card__ep">Tập 151</span>
                        <button type="button" class="hh3d-follow-card__remove btn-remove-follow" data-id="20224"
                            data-type="db" title="Bỏ theo dõi" aria-label="Bỏ theo dõi">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="hh3d-follow-card__info">
                        <div class="hh3d-follow-card__info-ambient" aria-hidden="true">
                            <img class="hh3d-follow-card__info-ambient-blur"
                                src="https://hoathinh3d.st/wp-content/uploads/2023/09/tien-nghich-6-300x450.jpg" alt=""
                                loading="lazy" decoding="async">
                            <span class="hh3d-follow-card__info-ambient-grain"></span>
                        </div>
                        <div class="hh3d-follow-card__info-scrim" aria-hidden="true"></div>
                        <div class="hh3d-follow-card__info-body">
                            <h3 class="hh3d-follow-card__title"><a href="https://hoathinh3d.st/tien-nghich">Tiên
                                    Nghịch</a></h3>
                            <p class="hh3d-follow-card__chip" title="Phim cập nhật tập mới: 26/07/2026 19:34:08"><i
                                    class="far fa-clock" aria-hidden="true"></i><span>Cập nhật · 23 giờ trước</span></p>
                        </div>
                    </div>
                </article>
                <article class="hh3d-follow-card" data-id="1766">
                    <div class="hh3d-follow-card__poster">
                        <a href="https://hoathinh3d.st/pham-nhan-tu-tien-phan-3" class="hh3d-follow-card__thumb"
                            title="Phàm Nhân Tu Tiên Phần 3">
                            <img src="https://hoathinh3d.st/wp-content/uploads/2026/06/pham-nhan-tu-tien-phan-3-thumb-300x450.jpg"
                                alt="Phàm Nhân Tu Tiên Phần 3" loading="lazy">
                        </a>
                        <span class="hh3d-follow-card__ep">Tập 184</span>
                        <button type="button" class="hh3d-follow-card__remove btn-remove-follow" data-id="1766"
                            data-type="db" title="Bỏ theo dõi" aria-label="Bỏ theo dõi">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="hh3d-follow-card__info">
                        <div class="hh3d-follow-card__info-ambient" aria-hidden="true">
                            <img class="hh3d-follow-card__info-ambient-blur"
                                src="https://hoathinh3d.st/wp-content/uploads/2026/06/pham-nhan-tu-tien-phan-3-thumb-300x450.jpg"
                                alt="" loading="lazy" decoding="async">
                            <span class="hh3d-follow-card__info-ambient-grain"></span>
                        </div>
                        <div class="hh3d-follow-card__info-scrim" aria-hidden="true"></div>
                        <div class="hh3d-follow-card__info-body">
                            <h3 class="hh3d-follow-card__title"><a
                                    href="https://hoathinh3d.st/pham-nhan-tu-tien-phan-3">Phàm Nhân Tu Tiên Phần 3</a>
                            </h3>
                            <p class="hh3d-follow-card__chip" title="Phim cập nhật tập mới: 25/07/2026 16:08:11"><i
                                    class="far fa-clock" aria-hidden="true"></i><span>Cập nhật · 2 ngày trước</span></p>
                        </div>
                    </div>
                </article>
            </div>
            <div id="followEmptyState" class="hh3d-follow-empty" style="display:none;">
                <div class="hh3d-follow-empty__icon"><i class="far fa-heart"></i></div>
                <h3>Chưa có phim theo dõi</h3>
                <p>Hãy nhấn nút "Theo dõi" ở các bộ phim bạn thích!</p>
            </div>
            <nav id="followPagination" class="hh3d-follow-pagination" style="display:none;" aria-label="Phân trang">
                <button type="button" id="followPrevPage" class="hh3d-follow-pagination__btn"> <i
                        class="fas fa-chevron-left"></i> Trước </button>
                <div id="followPageNumbers" class="hh3d-follow-pagination__nums"></div> <button type="button"
                    id="followNextPage" class="hh3d-follow-pagination__btn"> Sau <i class="fas fa-chevron-right"></i>
                </button>
            </nav>
        </div>
    </main>
</body>

</html>
